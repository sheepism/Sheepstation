- type: entity
  name: Cardinal
  parent: [BaseWeaponRifle, BaseGunWieldable]
  id: WeaponRifleCardinal
  description: A special order variant of the Lecter custom-made for the Sector Marshals. Chambered in .25 Rifle. Lightweight, accurate, and tacticool.
  components:
  - type: Sprite
    sprite: _Sheep/Items/Weapons/cardinal.rsi/
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -30
  - type: Gun
    minAngle: 21
    maxAngle: 32
    angleIncrease: 6
    angleDecay: 24
    fireRate: 6.0
    selectedMode: Burst
    availableModes:
    - SemiAuto
    - FullAuto
    - Burst
  - type: ChamberMagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineCaselessRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineCaselessRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeCaselessRifle # CartridgeCaselessRifle for now until .25 rifle is added
        priority: 1
        whitelist:
          tags:
          - CartridgeCaselessRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Clothing
    sprite: _Sheep/Items/Weapons/cardinal.rsi/
