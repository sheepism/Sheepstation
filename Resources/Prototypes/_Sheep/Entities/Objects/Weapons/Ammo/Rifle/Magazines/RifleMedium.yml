- type: entity
  parent: BaseMagazineRifle
  id: MagazineRifleMedium
  name: "magazine (.25 rifle)"
  description: 30-round double stack magazine for combat rifles. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: BallisticAmmoProvider
    capacity: 30
    proto: CartridgeRifleMedium
  - type: Tag
    tags:
     - MagazineRifleMedium
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

